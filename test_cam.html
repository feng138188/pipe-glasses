<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摄像头测试</title>
<style>
body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
video{width:100%;max-width:100vw}
#msg{color:#fff;font-size:20px;padding:20px;text-align:center}
button{font-size:24px;padding:20px 40px;border:none;border-radius:12px;background:#0a0;color:#fff;margin:20px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="msg">等待...</div>
<button id="btn" onclick="go()">启动摄像头</button>
<script>
async function go(){
  document.getElementById('msg').innerText='请求中...';
  try{
    let s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    let v = document.getElementById('v');
    v.srcObject = s;
    v.onloadedmetadata = () => v.play();
    document.getElementById('msg').innerText='摄像头已启动';
    document.getElementById('btn').style.display='none';
  }catch(e){
    document.getElementById('msg').innerText='错误: '+e.message;
  }
}
window.onload = () => document.getElementById('msg').innerText = '就绪';
</script>
</body>
</html>
