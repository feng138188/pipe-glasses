<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>管道检测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;flex-direction:column}
#box{flex:1;position:relative;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#msg{position:absolute;top:10px;left:10px;z-index:10;color:#fff;font:14px monospace;background:rgba(0,0,0,0.7);padding:8px 14px;border-radius:8px;pointer-events:none}
#bar{display:flex;gap:8px;padding:6px 10px;background:#181818;color:#aaa;font:12px monospace;justify-content:center}
#btns{display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:center;background:#111}
button{font-size:15px;padding:9px 14px;border:none;border-radius:8px;background:#2a2a2a;color:#ccc;min-width:40px}
button.on{background:#0a0}
select{font-size:15px;padding:9px;border-radius:8px;background:#2a2a2a;color:#ccc;border:none}
.g{color:#0f0}
</style>
</head>
<body>
<div id="box">
  <video id="vi" autoplay playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="msg"></div>
</div>
<div id="bar">
  <span>俯仰:<span class="g" id="sp">0°</span></span>
  <span>横滚:<span class="g" id="sr">0°</span></span>
  <span>FPS:<span class="g" id="sf">0</span></span>
</div>
<div id="btns">
  <button id="bu">▲</button><button id="bd">▼</button>
  <button id="bl">◀</button><button id="br">▶</button>
  <button id="bz">归零</button>
  <select id="sel"><option value="50">DN50</option><option value="100" selected>DN100</option><option value="150">DN150</option><option value="200">DN200</option></select>
</div>

<script>
let v, c, cx, streaming=false, pipeDia=100;
let imu={pitch:0,roll:0}, rf=0, t0=0, fps=0;
let prev=null, lost=0;

// 启动
async function start(){
  let m=document.getElementById('msg');
  m.innerHTML='请求摄像头...';
  try{
    let s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}, audio:false});
    v = document.getElementById('vi');
    c = document.getElementById('c');
    cx = c.getContext('2d');
    v.srcObject = s;
    v.onloadedmetadata = function(){
      v.play();
      streaming = true;
      t0 = performance.now();
      m.innerHTML = '点击画面锁定管道';
      setTimeout(function(){ if(streaming) m.style.display='none'; }, 3000);
      loop();
    };
  }catch(e){
    m.innerHTML = '摄像头错误: '+e.message;
  }
}

// 点击启动
(function(){
  let m = document.getElementById('msg');
  m.innerHTML = '▶ 点击启动';
  m.style.cssText = 'cursor:pointer;pointer-events:auto;background:#0a0;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;padding:16px 32px;text-align:center;border-radius:12px';
  m.addEventListener('click', function(){
    m.style.cssText = 'top:10px;left:10px;transform:none;font-size:14px;padding:8px 14px;cursor:default;pointer-events:none;background:rgba(0,0,0,0.7)';
    start();
  });
})();

// 陀螺仪
window.addEventListener('deviceorientation', function(e){
  if(e.beta!==null)imu.pitch=e.beta;
  if(e.gamma!==null)imu.roll=e.gamma;
  document.getElementById('sp').textContent=imu.pitch.toFixed(1)+'°';
  document.getElementById('sr').textContent=imu.roll.toFixed(1)+'°';
}, true);

// 点击锁定管道
c?.addEventListener('click', function(e){
  if(!streaming||!prev)return;
  // 清除跟踪，让下一帧全局重搜
  prev=null; lost=0;
  let m=document.getElementById('msg');
  m.style.display='block'; m.innerHTML='重新搜索...';
  setTimeout(function(){m.style.display='none';},800);
});

// ===== DINO API 调用 =====
let dinoUrl = new URLSearchParams(location.search).get('dino') || '';
let dinoEnabled = !!dinoUrl;

async function callSAM(jpgBlob, tapX, tapY){
  if(!dinoEnabled)return null;
  let fd = new FormData();
  fd.append('file', jpgBlob, 'frame.jpg');
  try{
    let r = await fetch(dinoUrl+'/sam?x='+tapX+'&y='+tapY, {method:'POST', body:fd});
    if(!r.ok)return null;
    let d = await r.json();
    if(d.detected) return d;
  }catch(e){}
  return null;
}

async function callDINO(jpgBlob){
  if(!dinoEnabled)return null;
  let fd = new FormData();
  fd.append('file', jpgBlob, 'frame.jpg');
  try{
    let r = await fetch(dinoUrl+'/detect', {method:'POST', body:fd});
    if(!r.ok)return null;
    let d = await r.json();
    if(d.detected) return d;
  }catch(e){}
  return null;
}

// ===== 检测算法 =====
function detectLines(imgData, w, h, trackMode){
  let gray = new Uint8Array(w*h);
  let d = imgData.data;
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);

  // Sobel
  let edge = new Uint8Array(w*h);
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      let p=y*w+x;
      let gx = -gray[p-w-1]-2*gray[p-1]-gray[p+w-1]+gray[p-w+1]+2*gray[p+1]+gray[p+w+1];
      let gy = -gray[p-w-1]-2*gray[p-w]-gray[p-w+1]+gray[p+w-1]+2*gray[p+w]+gray[p+w+1];
      edge[p] = (Math.sqrt(gx*gx+gy*gy)>70)?255:0;
    }
  }

  // 找长水平连续段
  let lines = [];
  let ryStart=0, ryEnd=h, minLen=150;
  if(trackMode && prev){
    let cy = (prev[1]+prev[3])/2;
    ryStart = Math.max(0, cy-60);
    ryEnd = Math.min(h, cy+60);
  }

  for(let y=ryStart; y<ryEnd; y+=3){
    let run=0, bestRun=0, bestX=0;
    for(let x=0; x<w; x++){
      if(edge[y*w+x]>0){run++; if(run>bestRun){bestRun=run; bestX=x;}}
      else run=0;
    }
    if(bestRun>=minLen){
      let fy=y;
      // 找最佳拟合线：扫描相邻 y 的线段
      let allRuns=[];
      for(let dy=-5;dy<=5;dy+=2){
        let yy=y+dy; if(yy<0||yy>=h)continue;
        let r=0, bx=0;
        for(let x=bestX-bestRun; x<bestX+20; x++){
          if(x>=0&&x<w&&edge[yy*w+x]>0)r++; else {if(r>bestRun*0.3)allRuns.push([yy,x-r,x]); r=0;}
        }
      }
      if(allRuns.length>0) lines.push([bestX-bestRun, y, bestX, y]);
    }
  }

  if(lines.length===0)return null;

  // 选最长+颜色分数
  let best=null, bestScore=0;
  for(let l of lines){
    let dx=l[2]-l[0], dy=l[3]-l[1];
    let len=Math.sqrt(dx*dx+dy*dy);
    if(len<100)continue;
    let score=len;
    // 颜色一致性
    let nx=-dy/(len||1), ny=dx/(len||1);
    let samples=[];
    for(let t=0;t<8;t++){
      let px=Math.round(l[0]+dx*t/7+nx*12), py=Math.round(l[1]+dy*t/7+ny*12);
      if(px<0||px>=w||py<0||py>=h)continue;
      let i0=(py*w+px)*4;
      samples.push([d[i0],d[i0+1],d[i0+2]]);
    }
    if(samples.length>=5){
      let m=[0,0,0],vr=[0,0,0];
      for(let s of samples){m[0]+=s[0];m[1]+=s[1];m[2]+=s[2];}
      m=m.map(x=>x/samples.length);
      for(let s of samples){vr[0]+=(s[0]-m[0])**2;vr[1]+=(s[1]-m[1])**2;vr[2]+=(s[2]-m[2])**2;}
      let stdv=Math.sqrt((vr[0]+vr[1]+vr[2])/samples.length/3)/100;
      score=len*(1+Math.max(0,1-stdv));
    }
    if(score>bestScore){bestScore=score; best=l;}
  }
  return best;
}

function calcSlope(ln, iw, ih){
  let[x1,y1,x2,y2]=ln;
  // Roll补偿
  if(Math.abs(imu.roll)>0.5){
    let r=-imu.roll*Math.PI/180, cr=Math.cos(r), sr=Math.sin(r);
    let cx0=iw/2, cy0=ih/2;
    let dx1=x1-cx0,dy1=y1-cy0,dx2=x2-cx0,dy2=y2-cy0;
    x1=dx1*cr-dy1*sr+cx0; y1=dx1*sr+dy1*cr+cy0;
    x2=dx2*cr-dy2*sr+cx0; y2=dx2*sr+dy2*cr+cy0;
  }
  if(x1>x2){let t=x1;x1=x2;x2=t;t=y1;y1=y2;y2=t;}
  let ia=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  let ra=ia-imu.pitch;
  let p=Math.tan(ra*Math.PI/180)*100;
  return{ra:ra, pct:p, x1:x1,y1:y1,x2:x2,y2:y2};
}

function estHt(ln, ih){
  let cy=(ln[1]+ln[3])/2;
  let va=(cy-ih/2)*60/ih;
  return Math.max(0, 1.6-2*Math.tan((va+imu.pitch)*Math.PI/180));
}

// ===== 主循环 =====
function loop(){
  if(!streaming){requestAnimationFrame(loop);return;}

  let w=v.videoWidth||640, h=v.videoHeight||480;
  c.width=w; c.height=h;
  cx.drawImage(v,0,0,w,h);
  let img = cx.getImageData(0,0,w,h);

  let trackMode = prev&&lost<30;
  let line = detectLines(img, w, h, trackMode);

  // DINO 重搜索：跟踪丢失或每 60 帧
  if(!line && dinoEnabled && rf%60===0){
    c.toBlob(async function(blob){
      let d=await callDINO(blob);
      if(d&&d.box){
        // 在 DINO 框内拟合一条线
        let bx=d.box, x1=bx[0], y1=bx[1], x2=bx[2], y2=bx[3];
        let mx=(x1+x2)/2, my=(y1+y2)/2;
        // 简单：取框的水平中线
        let fline=[x1, my, x2, my];
        prev=fline; lost=0;
        let m=document.getElementById('msg');
        m.style.display='block'; m.innerHTML='DINO: '+d.label+' ('+Math.round(d.score*100)+'%)';
        setTimeout(function(){m.style.display='none';},1500);
      }
    }, 'image/jpeg', 0.5);
  }

  if(line){prev=line; lost=0;}
  else if(prev) lost++;

  if(line){
    let sl = calcSlope(line, w, h);
    let ht = estHt(line, h);
    let absA = Math.abs(sl.ra);

    // 画线
    cx.strokeStyle='#0f0'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(sl.x1,sl.y1); cx.lineTo(sl.x2,sl.y2); cx.stroke();
    cx.fillStyle='#0f0';
    cx.beginPath(); cx.arc(sl.x1,sl.y1,5,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(sl.x2,sl.y2,5,0,Math.PI*2); cx.fill();
    // 水平参考
    let my=(sl.y1+sl.y2)/2;
    cx.strokeStyle='rgba(150,150,150,0.5)'; cx.lineWidth=1;
    cx.setLineDash([8,8]); cx.beginPath(); cx.moveTo(0,my); cx.lineTo(w,my); cx.stroke(); cx.setLineDash([]);

    // 面板
    cx.fillStyle='rgba(0,0,0,0.65)'; cx.fillRect(10,10,255,120);
    let sy=32;
    cx.font='bold 14px monospace';
    cx.fillStyle=(absA>=2&&absA<=5)?'#0f0':(absA<1.5||absA>6)?'#f44':'#ff0';
    cx.fillText('坡度: '+sl.ra.toFixed(1)+'° ('+sl.pct.toFixed(1)+'%)',20,sy); sy+=24;
    cx.fillStyle='#0f0'; cx.fillText('高度: '+ht.toFixed(2)+'m (DN'+pipeDia+')',20,sy); sy+=24;
    cx.fillStyle='#aaa'; cx.font='11px monospace';
    cx.fillText('pitch:'+imu.pitch.toFixed(0)+'° roll:'+imu.roll.toFixed(0)+'°',20,sy); sy+=22;
    cx.font='bold 14px monospace';
    cx.fillStyle=(absA>=2&&absA<=5)?'#0f0':'#f44';
    cx.fillText((absA>=2&&absA<=5)?'✓ PASS':'✗ 需调整',20,sy);
  }

  cx.fillStyle='rgba(150,150,150,0.7)'; cx.font='11px monospace';
  cx.fillText('目标: 坡度2-5° | 高度0.5-1.5m | 点击重搜 | DINO AI',10,h-10);

  rf++; let now=performance.now();
  if(now-t0>=1000){fps=Math.round(rf*1000/(now-t0));document.getElementById('sf').textContent=fps;rf=0;t0=now;}
  requestAnimationFrame(loop);
}

// 按钮
[{id:'bu',p:0,r:0},{id:'bd',p:25,r:0},{id:'bl',p:0,r:-15},{id:'br',p:0,r:15}].forEach(function(b){
  let el=document.getElementById(b.id);
  el.addEventListener('pointerdown',function(){el.classList.add('on');imu.pitch=b.p;imu.roll=b.r;});
  el.addEventListener('pointerup',function(){el.classList.remove('on');imu.pitch=0;imu.roll=0;});
  el.addEventListener('pointerleave',function(){el.classList.remove('on');imu.pitch=0;imu.roll=0;});
});
document.getElementById('bz').addEventListener('click',function(){imu.pitch=0;imu.roll=0;});
document.getElementById('sel').addEventListener('change',function(){pipeDia=parseInt(document.getElementById('sel').value);});
</script>
</body>
</html>
