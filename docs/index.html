<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>管道检测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;height:100vh;touch-action:manipulation}
#box{flex:1;position:relative;overflow:hidden}
video{z-index:1;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
canvas{z-index:2;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#touch{z-index:3;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.005)}
#msg{position:absolute;top:0;left:0;z-index:10;background:rgba(0,0,0,0.75);color:#fff;padding:8px 14px;font:14px monospace;border-radius:0 0 10px 0;pointer-events:none}
#bar{display:flex;gap:6px;padding:6px 8px;background:#181818;color:#aaa;font:12px monospace;justify-content:center;flex-wrap:wrap}
#ctl{display:flex;gap:6px;padding:6px;background:#111;justify-content:center;flex-wrap:wrap}
button{padding:10px 14px;border:none;border-radius:8px;font-size:15px;min-width:40px;color:#fff}
.btn-sam{background:#0a0}.btn-el{background:#08f}.btn-other{background:#333}
.g{color:#0f0}.b{color:#0af}
</style>
</head>
<body>
<div id="box">
  <video id="vi" autoplay playsinline muted></video>
  <canvas id="ch" style="display:none"></canvas>
  <canvas id="c"></canvas>
  <div id="touch"></div>
  <div id="msg"></div>
</div>
<div id="bar">
  <span>俯仰:<span class="g" id="sp">0°</span></span>
  <span>横滚:<span class="g" id="sr">0°</span></span>
  <span>FPS:<span class="g" id="sf">0</span></span>
  <span id="tag" class="b">SAM点击</span>
</div>
<div id="ctl">
  <button id="bt-sam" class="btn-sam">SAM</button>
  <button id="bt-el" class="btn-other">椭圆</button>
  <button id="bt-up" class="btn-other">▲</button>
  <button id="bt-dn" class="btn-other">▼</button>
  <button id="bt-lt" class="btn-other">◀</button>
  <button id="bt-rt" class="btn-other">▶</button>
  <button id="bt-z" class="btn-other">归零</button>
</div>

<script>
// 状态
let v,c,cx,hc,hx,streaming=false;
let imu={pitch:0,roll:0}, rf=0, t0=0;
let prev=null, lost=0, mode='sam', stableCnt=0, pendingLine=null;
let dragBox=null, dragStart=null;
let apiUrl=(new URLSearchParams(location.search).get('dino')||'');
let m=document.getElementById('msg');

// 启动按钮
m.innerHTML='▶ 点击启动';
m.style.cssText='cursor:pointer;pointer-events:auto;background:#0a0;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;padding:16px 32px;text-align:center;border-radius:12px';
function go(){
  m.style.cssText='top:10px;left:10px;transform:none;font-size:14px;padding:8px 14px;cursor:default;pointer-events:none;background:rgba(0,0,0,0.7)';
  m.innerHTML='请求摄像头...';
  v=document.getElementById('vi'); c=document.getElementById('c'); cx=c.getContext('2d');
  hc=document.getElementById('ch'); hx=hc.getContext('2d');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}},audio:false}).then(s=>{
    v.srcObject=s; v.onloadedmetadata=()=>{v.play(); streaming=true; t0=performance.now(); m.innerHTML=''; loop();};
  }).catch(e=>{m.innerHTML='摄像头错误: '+e.message;});
}
m.addEventListener('click',go);

// 陀螺仪
window.addEventListener('deviceorientation',e=>{
  if(e.beta!==null)imu.pitch=e.beta;
  if(e.gamma!==null)imu.roll=e.gamma;
  document.getElementById('sp').textContent=imu.pitch.toFixed(1)+'°';
  document.getElementById('sr').textContent=imu.roll.toFixed(1)+'°';
},true);

// 模式切换
document.getElementById('bt-sam').addEventListener('click',()=>{
  mode='sam'; document.getElementById('bt-sam').className='btn-sam';
  document.getElementById('bt-el').className='btn-other';
  document.getElementById('tag').textContent='SAM点击';
});
document.getElementById('bt-el').addEventListener('click',()=>{
  mode='ellipse'; document.getElementById('bt-el').className='btn-el';
  document.getElementById('bt-sam').className='btn-other';
  document.getElementById('tag').textContent='椭圆框选';
});

// 触屏（绑定到透明 touch 层）
let tc = document.getElementById('touch');
tc.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!streaming)return;
  let r=tc.getBoundingClientRect(), vw=v.videoWidth||640, vh=v.videoHeight||480;
  let x=Math.round((e.clientX-r.left)*vw/r.width), y=Math.round((e.clientY-r.top)*vh/r.height);

  if(mode==='ellipse'){
    dragStart={x,y}; dragBox=null;
  }else{
    m.style.display='block'; m.innerHTML='SAM...';
    c.toBlob(b=>{callAPI('/sam?x='+x+'&y='+y,b);},'image/jpeg',0.6);
  }
});

tc.addEventListener('pointermove',e=>{
  if(!dragStart)return;
  let r=tc.getBoundingClientRect(), vw=v.videoWidth||640, vh=v.videoHeight||480;
  let x=Math.round((e.clientX-r.left)*vw/r.width), y=Math.round((e.clientY-r.top)*vh/r.height);
  dragBox={x1:Math.min(dragStart.x,x),y1:Math.min(dragStart.y,y),x2:Math.max(dragStart.x,x),y2:Math.max(dragStart.y,y)};
});

tc.addEventListener('pointerup',e=>{
  if(!dragStart||!dragBox){dragStart=null;return;}
  let box=dragBox; dragStart=null; dragBox=null;
  m.style.display='block'; m.innerHTML='椭圆检测...';
  c.toBlob(b=>{callAPI('/ellipse?x1='+box.x1+'&y1='+box.y1+'&x2='+box.x2+'&y2='+box.y2,b);},'image/jpeg',0.6);
});

tc.addEventListener('pointercancel',()=>{dragStart=null; dragBox=null;});

async function callAPI(path,blob){
  if(!blob)return;
  let fd=new FormData(); fd.append('file',blob,'f.jpg');
  try{
    let r=await fetch(apiUrl+path,{method:'POST',body:fd});
    if(!r.ok){m.innerHTML='API错误';return;}
    let d=await r.json();
    if(d&&d.line){prev=d.line; lost=0; m.innerHTML='OK 角度:'+d.angle_deg+'°';}
    else{m.innerHTML='未检测到';}
  }catch(e){m.innerHTML='连接失败';}
  setTimeout(()=>{m.style.display='none';},1500);
}

// 本地检测
function detectLocal(img,w,h){
  let gray=new Uint8Array(w*h), d=img.data;
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
  let edge=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    let p=y*w+x;
    let gx=-gray[p-w-1]-2*gray[p-1]-gray[p+w-1]+gray[p-w+1]+2*gray[p+1]+gray[p+w+1];
    let gy=-gray[p-w-1]-2*gray[p-w]-gray[p-w+1]+gray[p+w-1]+2*gray[p+w]+gray[p+w+1];
    edge[p]=(Math.sqrt(gx*gx+gy*gy)>70)?255:0;
  }
  let mrg=30; // 排除屏幕边缘
  let best=null,bl=0,ryS=mrg,ryE=h-mrg;
  if(prev&&lost<30){let cy=(prev[1]+prev[3])/2; ryS=Math.max(mrg,cy-50); ryE=Math.min(h-mrg,cy+50);}
  for(let y=ryS;y<ryE;y+=3){
    let run=0;
    for(let x=0;x<w;x++){if(edge[y*w+x])run++;else{if(run>=150&&run>bl){bl=run;best=[x-run,y,x,y];}run=0;}}
    if(run>=150&&run>bl){bl=run;best=[w-run,y,w,y];}
  }
  return best;
}

function loop(){
  if(!streaming){requestAnimationFrame(loop);return;}
  let vw=v.videoWidth||640, vh=v.videoHeight||480;
  c.width=vw; c.height=vh;
  cx.drawImage(v,0,0,vw,vh);
  let img=cx.getImageData(0,0,vw,vh);

  // 始终跑本地检测（带稳定过滤）
  let line=detectLocal(img,vw,vh);
  if(line){
    // 检查是否和上一帧候选位置接近
    if(pendingLine){
      let dy=Math.abs(((line[1]+line[3])/2) - ((pendingLine[1]+pendingLine[3])/2));
      if(dy<40){ stableCnt++; }
      else{ stableCnt=1; pendingLine=line; }
    }else{ pendingLine=line; stableCnt=1; }
    // 需要连续5帧稳定才锁定
    if(stableCnt>=5 && (!prev || stableCnt>=3)){
      prev=line; lost=0;
    }
  }else{
    stableCnt=0; pendingLine=null;
    if(prev)lost++;
    if(lost>15){prev=null; lost=0;}
  }
  // 每60帧用SAM自动验证一次（API模式）
  if(apiUrl && prev && rf%60===0){
    c.toBlob(b=>{
      let mx=Math.round((prev[0]+prev[2])/2), my=Math.round((prev[1]+prev[3])/2);
      callAPI('/sam?x='+mx+'&y='+my,b);
    },'image/jpeg',0.5);
  }

  if(prev){
    let[x1,y1,x2,y2]=prev;
    if(x1>x2){let t=x1;x1=x2;x2=t;t=y1;y1=y2;y2=t;}
    let ra=Math.atan2(y2-y1,x2-x1)*180/Math.PI-imu.pitch;
    cx.strokeStyle='#0f0'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();
    cx.fillStyle='#0f0'; cx.beginPath(); cx.arc(x1,y1,5,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(x2,y2,5,0,Math.PI*2); cx.fill();
    let my=(y1+y2)/2;
    cx.setLineDash([8,8]); cx.strokeStyle='rgba(150,150,150,0.5)'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(0,my); cx.lineTo(vw,my); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle='rgba(0,0,0,0.65)'; cx.fillRect(10,10,250,100);
    cx.font='bold 14px monospace';
    let absA=Math.abs(ra);
    cx.fillStyle=(absA>=2&&absA<=5)?'#0f0':(absA<1.5||absA>6)?'#f44':'#ff0';
    cx.fillText('坡度: '+ra.toFixed(1)+'° ('+(Math.tan(ra*Math.PI/180)*100).toFixed(1)+'%)',20,32);
    cx.fillStyle='#0f0'; cx.fillText('高度: N/A (DN100)',20,56);
    cx.fillStyle='#aaa'; cx.font='11px monospace';
    cx.fillText('pitch:'+imu.pitch.toFixed(0)+'° roll:'+imu.roll.toFixed(0)+'°',20,74);
  }

  if(dragBox){
    cx.strokeStyle='#0ff'; cx.lineWidth=2;
    cx.strokeRect(dragBox.x1,dragBox.y1,dragBox.x2-dragBox.x1,dragBox.y2-dragBox.y1);
  }

  cx.fillStyle='rgba(150,150,150,0.7)'; cx.font='11px monospace';
  cx.fillText('目标:2-5° | SAM/椭圆 | '+(apiUrl?'AI':'离线'),10,vh-10);

  rf++; let now=performance.now();
  if(now-t0>=1000){document.getElementById('sf').textContent=Math.round(rf*1000/(now-t0));rf=0;t0=now;}
  requestAnimationFrame(loop);
}

// IMU按钮
[{id:'bt-up',p:0,r:0},{id:'bt-dn',p:25,r:0},{id:'bt-lt',p:0,r:-15},{id:'bt-rt',p:0,r:15}].forEach(b=>{
  let el=document.getElementById(b.id);
  el.addEventListener('pointerdown',()=>{el.classList.add('on');imu.pitch=b.p;imu.roll=b.r;});
  el.addEventListener('pointerup',()=>{el.classList.remove('on');imu.pitch=0;imu.roll=0;});
  el.addEventListener('pointerleave',()=>{el.classList.remove('on');imu.pitch=0;imu.roll=0;});
});
document.getElementById('bt-z').addEventListener('click',()=>{imu.pitch=0;imu.roll=0;});
</script>
</body>
</html>
