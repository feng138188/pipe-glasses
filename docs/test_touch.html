<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>触屏测试</title>
<style>
body{margin:0;background:#000;height:100vh;touch-action:manipulation}
#t{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.01);z-index:99}
#i{position:absolute;top:10px;left:10px;color:#fff;font:16px monospace;z-index:100;pointer-events:none}
</style>
</head><body>
<div id="t"></div>
<div id="i">触摸测试 - 点屏幕任意位置</div>
<script>
let c=0;
document.getElementById('t').addEventListener('pointerdown',e=>{
  c++;
  document.getElementById('i').innerHTML='✅ 触摸 #'+c+' 坐标:('+e.clientX+','+e.clientY+')';
});
</script>
</body></html>
